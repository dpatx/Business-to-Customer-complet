spring:
  application:
    name: configuration-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/dpatx/mytest
          clone-on-start: true
          default-label: main
          # Force Spring to look in the root folder for OLX-LOGIN.yml
          search-paths: '/'
          
server:
  port: 8888
